services:
  - type: web
    name: pdf-maker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free          # cambiar a 'starter' si necesitas más recursos
    healthCheckPath: /health
    disk:
      name: pdf-maker-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: PDF Maker
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true   # Render genera uno seguro automáticamente
      - key: APP_URL
        value: https://pdf-maker.onrender.com   # actualiza con tu URL real
      - key: LOG_LEVEL
        value: error
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: pdf-maker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pdf-maker-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: pdf-maker-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pdf-maker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pdf-maker-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: pdf-maker-db
    databaseName: pdf_maker
    plan: free   # PostgreSQL gratuito (90 días, luego $7/mes o exportar a externa)
